<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Asefa | Social Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Iddoo suuraan kee keessatti calaqqisu */
        .image-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Bal'ina suuraa madaaluuf */
            height: 100%;
            max-height: 90vh;
            background: url('my.jpg') no-repeat center center;
            background-size: contain;
        }

        /* Hotspots: Iconoota suuraa keessa jiran irratti haguugamanii hojjetan */
        .social-link {
            position: absolute;
            display: block;
            border-radius: 50%;
            /* Yoo barbaadde background-color: rgba(255,0,0,0.3); godhiitii bakka iconii suuraarratti jiru sirriitti argachuuf ilaali (test godhi) */
            transition: all 0.2s ease;
        }

        .social-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
        }

        /* Safartoota iconootaa (Safartoonni kun suuraa kee keessatti bakka iconootaa irratti sirriitti taa'u) */
        /* 1. Facebook Icon */
        .fb { top: 25%; left: 33%; width: 9%; height: 9%; }
        
        /* 2. Instagram Icon */
        .ig { top: 26%; left: 42%; width: 9%; height: 9%; }
        
        /* 3. Twitter / X Icon */
        .twitter { top: 35%; left: 29%; width: 9%; height: 9%; }
        
        /* 4. LinkedIn Icon */
        .linkedin { top: 39%; left: 41%; width: 9%; height: 9%; }

        /* 5. YouTube Icon */
        .youtube { top: 46%; left: 26%; width: 9%; height: 9%; }

        /* 6. Pinterest Icon */
        .pinterest { top: 48%; left: 42%; width: 9%; height: 9%; }

        /* 7. WhatsApp Icon */
        .whatsapp { top: 57%; left: 30%; width: 10%; height: 10%; }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .image-container {
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                background-size: cover;
            }
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- Iconoota kana keessatti linkii account kee dhugaa galchi -->
        
        <!-- Facebook -->
        <a href="https://facebook.com/USERNAMEEDHEE" target="_blank" class="social-link fb" title="Facebook"></a>
        
        <!-- Instagram -->
        <a href="https://instagram.com/USERNAMEEDHEE" target="_blank" class="social-link ig" title="Instagram"></a>
        
        <!-- Twitter -->
        <a href="https://twitter.com/USERNAMEEDHEE" target="_blank" class="social-link twitter" title="Twitter"></a>
        
        <!-- LinkedIn -->
        <a href="https://linkedin.com/in/USERNAMEEDHEE" target="_blank" class="social-link linkedin" title="LinkedIn"></a>
        
        <!-- YouTube -->
        <a href="https://youtube.com/@USERNAMEEDHEE" target="_blank" class="social-link youtube" title="YouTube"></a>
        
        <!-- Pinterest -->
        <a href="https://pinterest.com/USERNAMEEDHEE" target="_blank" class="social-link pinterest" title="Pinterest"></a>
        
        <!-- WhatsApp -->
        <a href="https://wa.me/LAMOON_KEESSAN" target="_blank" class="social-link whatsapp" title="WhatsApp"></a>
    </div>

</body>
</html>
