<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qaroo Digital Agency | Lemma Asefa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0c101d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Iddoo walitti qabamiinsa suuraa fi barruulee */
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 95vh;
            background: url('my.jpg') no-repeat center center;
            background-size: contain;
        }

        /* Design barruu fi mata duree (Branding / Overlay) */
        .brand-overlay {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .brand-overlay h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .brand-overlay p {
            font-size: 0.85rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Hotspots: Iconoota suuraa irra jiran clickable gochuuf */
        .social-link {
            position: absolute;
            display: block;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .social-link:hover {
            background-color: rgba(251, 191, 36, 0.25);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
            border: 1px solid rgba(251, 191, 36, 0.6);
        }

        /* Safartoota iconootaa (Hotspots coordinates suuraa sana irratti) */
        .fb { top: 25%; left: 33%; width: 9%; height: 9%; }
        .ig { top: 26%; left: 42%; width: 9%; height: 9%; }
        .twitter { top: 35%; left: 29%; width: 9%; height: 9%; }
        .linkedin { top: 39%; left: 41%; width: 9%; height: 9%; }
        .youtube { top: 46%; left: 26%; width: 9%; height: 9%; }
        .pinterest { top: 48%; left: 42%; width: 9%; height: 9%; }
        .whatsapp { top: 57%; left: 30%; width: 10%; height: 10%; }

        @media (max-width: 600px) {
            .wrapper {
                max-width: 100vw;
                height: 100vh;
                background-size: cover;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Mata duree fi maqaa kee isa bifa ammayyaatiin suuraarratti dabalame -->
        <div class="brand-overlay">
            <h1>Qaroo Digital Agency</h1>
            <p>Lemma Asefa &bull; Digital Creator</p>
        </div>

        <!-- Social Media Clickable Hotspots (Bakka linkii kee itti galchitu) -->
        <a href="https://facebook.com/USERNAMEEDHEE" target="_blank" class="social-link fb" title="Facebook"></a>
        <a href="https://instagram.com/USERNAMEEDHEE" target="_blank" class="social-link ig" title="Instagram"></a>
        <a href="https://twitter.com/USERNAMEEDHEE" target="_blank" class="social-link twitter" title="Twitter"></a>
        <a href="https://linkedin.com/in/USERNAMEEDHEE" target="_blank" class="social-link linkedin" title="LinkedIn"></a>
        <a href="https://youtube.com/@USERNAMEEDHEE" target="_blank" class="social-link youtube" title="YouTube"></a>
        <a href="https://pinterest.com/USERNAMEEDHEE" target="_blank" class="social-link pinterest" title="Pinterest"></a>
        <a href="https://wa.me/LAMOON_KEESSAN" target="_blank" class="social-link whatsapp" title="WhatsApp"></a>
    </div>

</body>
</html>
